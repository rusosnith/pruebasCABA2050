<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Street View – Comparador de épocas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    h1 { font-size: 1.6rem; margin-bottom: 0.3rem; color: #e0e0ff; }
    p.subtitle { color: #aaa; margin-bottom: 1.5rem; font-size: 0.9rem; text-align: center; }
    .card {
      background: #16213e;
      border: 1px solid #2a2a5a;
      border-radius: 12px;
      padding: 1.5rem;
      width: 100%;
      max-width: 760px;
      margin-bottom: 1.5rem;
    }
    label { display: block; font-size: 0.82rem; color: #aab; margin-bottom: 0.3rem; margin-top: 0.9rem; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border-radius: 7px;
      border: 1px solid #3a3a6a;
      background: #0f0f2e;
      color: #ddf;
      font-size: 0.9rem;
      outline: none;
    }
    input:focus { border-color: #5a7fff; }
    button {
      margin-top: 1.2rem;
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      background: #4a6fff;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    button:hover { background: #6a8fff; }
    button:disabled { background: #333; color: #666; cursor: default; }
    #status { min-height: 1.4rem; font-size: 0.88rem; color: #ff9966; margin-top: 0.7rem; text-align: center; }
    #status.ok { color: #66ffaa; }

    /* Selector de modo */
    .mode-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      background: #0f0f2e;
      border-radius: 10px;
      padding: 0.4rem;
    }
    .mode-tab {
      flex: 1;
      padding: 0.5rem 0.3rem;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: #778;
      font-size: 0.82rem;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s, color 0.2s;
      margin-top: 0;
    }
    .mode-tab:hover { background: #1a1a4e; color: #aaf; }
    .mode-tab.active { background: #4a6fff; color: #fff; }

    /* Comparador */
    #comparator-wrap { width: 100%; max-width: 900px; display: none; }
    .labels-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #aab;
      margin-bottom: 0.4rem;
      padding: 0 4px;
    }
    .labels-row span { font-weight: 600; color: #e0e0ff; }
    .comparator {
      position: relative;
      width: 100%;
      aspect-ratio: 3/2;
      border-radius: 10px;
      overflow: hidden;
      user-select: none;
      border: 2px solid #2a2a5a;
    }
    .comparator.mode-split { cursor: ew-resize; }
    .comparator img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    #img-base { z-index: 1; }
    #img-overlay { z-index: 2; }
    /* split mode */
    .mode-split #img-overlay { clip-path: inset(0 50% 0 0); opacity: 1; }
    /* opacity mode: overlay encima con opacidad controlada */
    .mode-opacity #img-overlay { clip-path: none; opacity: 1; }
    /* timeline: solo img-overlay visible */
    .mode-timeline #img-overlay { clip-path: none; opacity: 1; }

    .divider {
      position: absolute;
      top: 0; left: 50%;
      width: 3px; height: 100%;
      background: #fff;
      z-index: 10;
      transform: translateX(-50%);
      pointer-events: none;
      display: none;
    }
    .mode-split .divider { display: block; }
    .divider-handle {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 40px; height: 40px;
      background: #fff;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      font-size: 1rem; color: #333;
      pointer-events: none;
    }

    /* Controles */
    .controls { margin-top: 0.8rem; display: none; }
    .controls.visible { display: block; }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 0.8rem;
      color: #aab;
    }
    .slider-row input[type=range] { flex: 1; accent-color: #4a6fff; cursor: pointer; }
    .slider-label-left { min-width: 90px; font-weight: 600; color: #e0e0ff; font-size: 0.78rem; }
    .slider-label-right { min-width: 90px; text-align: right; font-weight: 600; color: #e0e0ff; font-size: 0.78rem; }
    .control-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 0.75rem;
      flex-wrap: wrap;
    }
    .mini-button {
      width: auto;
      margin-top: 0;
      padding: 0.55rem 1rem;
      font-size: 0.82rem;
      background: #22315d;
      border: 1px solid #3a4a7a;
    }
    .mini-button:hover { background: #31457f; }
    .mini-button.active { background: #4a6fff; border-color: #6a8fff; }
    .timeline-ticks {
      position: relative;
      height: 2.25rem;
      margin-top: 0.45rem;
      padding: 0 2px;
    }
    .timeline-tick {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      font-size: 0.68rem;
      color: #7d87ac;
      white-space: nowrap;
      text-align: center;
    }
    .timeline-tick::before {
      content: '';
      display: block;
      width: 2px;
      height: 10px;
      margin: 0 auto 0.25rem;
      background: #4a6fff;
      opacity: 0.7;
    }
    .timeline-tick.compact span { display: none; }
    .timeline-tick.compact::before { opacity: 0.35; height: 7px; }
    .timeline-tick.edge-left { transform: translateX(0); text-align: left; }
    .timeline-tick.edge-right { transform: translateX(-100%); text-align: right; }
    .timeline-tick.edge-left::before,
    .timeline-tick.edge-right::before { margin-left: 0; margin-right: 0; }
    .timeline-tick.edge-right::before { margin-left: auto; }
    .timeline-tick.edge-left::before { margin-right: auto; }
    .timeline-track-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: #6f78a0;
      margin-top: 0.15rem;
    }
    #tl-current-label { text-align: center; font-size: 0.9rem; color: #e0e0ff; margin-top: 0.5rem; font-weight: 600; }
    #hint { text-align: center; font-size: 0.78rem; color: #666; margin-top: 0.5rem; }
    .timeline-info {
      display: flex; gap: 1rem; margin-top: 1rem;
      font-size: 0.82rem; color: #aaa; flex-wrap: wrap;
    }
    .timeline-info .badge {
      background: #1a1a4e; border: 1px solid #3a3a7a;
      border-radius: 6px; padding: 0.4rem 0.8rem;
      flex: 1; min-width: 120px; text-align: center;
    }
    .timeline-info .badge strong { display: block; color: #e0e0ff; font-size: 1rem; }
  </style>
</head>
<body>

  <h1>🕐 Street View – Comparador de épocas</h1>
  <p class="subtitle">Pegá una URL de Google Street View y compará la imagen más vieja con la más nueva</p>

  <div class="card">
    <label for="sv-url">URL de Google Street View</label>
    <input type="text" id="sv-url"
      value="https://www.google.com/maps/@-34.5706263,-58.4757463,3a,90y,172.4h,92.43t/data=!3m8!1e1!3m6!1s_nnYC8_I-qxBMA3qY6Xy3A!2e0!5s20151001T000000!6shttps:%2F%2Fstreetviewpixels-pa.googleapis.com%2Fv1%2Fthumbnail%3Fcb_client%3Dmaps_sv.tactile%26w%3D900%26h%3D600%26pitch%3D-2.434849756316609%26panoid%3D_nnYC8_I-qxBMA3qY6Xy3A%26yaw%3D172.40459482211702!7i13312!8i6656?entry=ttu&g_ep=EgoyMDI2MDQyOS4wIKXMDSoASAFQAw%3D%3D" />

    <label for="api-key">
      Google Maps API Key
      <small style="color:#777"> — necesitás habilitar <em>Maps JavaScript API</em> y <em>Street View Static API</em></small>
    </label>
    <input type="password" id="api-key" placeholder="AIza…" />

    <button id="btn-compare" onclick="startComparison()">Comparar</button>
    <div id="status"></div>
  </div>

  <div id="comparator-wrap">

    <div class="mode-tabs">
      <button class="mode-tab active" id="tab-split" onclick="setMode('split', this)">✂️ Divisor</button>
      <button class="mode-tab" id="tab-opacity" onclick="setMode('opacity', this)">🌫️ Opacidad</button>
      <button class="mode-tab" id="tab-timeline" onclick="setMode('timeline', this)">🎞️ Timeline</button>
    </div>

    <div class="labels-row" id="main-labels">
      <div>⬅ MÁS VIEJA &nbsp;<span id="lbl-old">—</span></div>
      <div><span id="lbl-new">—</span>&nbsp; MÁS NUEVA ➡</div>
    </div>

    <div class="comparator mode-split" id="comparator"
         onmousedown="onCompMouseDown(event)" ontouchstart="onCompMouseDown(event)">
      <img id="img-base"    src="" alt="imagen base" />
      <img id="img-overlay" src="" alt="imagen overlay" />
      <div class="divider" id="divider">
        <div class="divider-handle">↔</div>
      </div>
    </div>

    <p id="hint">Arrastrá el divisor para comparar</p>

    <!-- Opacidad -->
    <div class="controls" id="ctrl-opacity">
      <div class="slider-row">
        <span class="slider-label-left"  id="op-lbl-old">vieja</span>
        <input type="range" id="opacity-slider" min="0" max="100" value="50"
               oninput="onOpacityInput(this.value)" />
        <span class="slider-label-right" id="op-lbl-new">nueva</span>
      </div>
      <div class="control-actions">
        <button class="mini-button" id="opacity-play" onclick="toggleOpacityAutoplay()">Play</button>
      </div>
    </div>

    <!-- Timeline -->
    <div class="controls" id="ctrl-timeline">
      <div class="slider-row">
        <span class="slider-label-left"  id="tl-lbl-left">—</span>
        <input type="range" id="timeline-slider" min="0" max="1" step="1" value="0"
               oninput="onTimelineInput(this.value)" />
        <span class="slider-label-right" id="tl-lbl-right">—</span>
      </div>
      <div class="timeline-ticks" id="tl-ticks"></div>
      <div class="timeline-track-meta">
        <span id="tl-range-start">—</span>
        <span id="tl-range-end">—</span>
      </div>
      <div class="control-actions">
        <button class="mini-button" id="timeline-prev" onclick="stepTimeline(-1)">Prev</button>
        <button class="mini-button" id="timeline-play" onclick="toggleTimelineAutoplay()">Play</button>
        <button class="mini-button" id="timeline-next" onclick="stepTimeline(1)">Next</button>
      </div>
      <div id="tl-current-label">—</div>
    </div>

    <div class="timeline-info">
      <div class="badge">📅 Más vieja<strong id="info-old">—</strong></div>
      <div class="badge">📅 Más nueva<strong id="info-new">—</strong></div>
      <div class="badge">🗺 Imágenes históricas<strong id="info-count">—</strong></div>
    </div>
  </div>

  <script>
    // ── Estado global ────────────────────────────────────────────────────────
    let currentMode  = 'split';
    let allPanos     = [];   // [{pano, label, rawDate, timestamp}] viejo→nuevo
    let currentHead  = 0, currentPitch = 0, currentKey = '';
    let oldPanoId = '', newPanoId = '';
    let timelineOffsets = [];
    let timelineRangeMax = 1;
    let currentTimelineIndex = 0;
    let autoplayMode = null;
    let autoplayToken = 0;
    let autoplayFrameId = null;
    let autoplayTimeoutId = null;
    const cachedTimelineUrls = new Set();
    const pendingTimelinePreloads = new Map();

    function updatePlayButtons() {
      const opacityButton = document.getElementById('opacity-play');
      const timelineButton = document.getElementById('timeline-play');

      opacityButton.textContent = autoplayMode === 'opacity' ? 'Detener' : 'Play';
      timelineButton.textContent = autoplayMode === 'timeline' ? 'Detener' : 'Play';
      opacityButton.classList.toggle('active', autoplayMode === 'opacity');
      timelineButton.classList.toggle('active', autoplayMode === 'timeline');
    }

    function clearAutoplayHandles() {
      if (autoplayFrameId) cancelAnimationFrame(autoplayFrameId);
      if (autoplayTimeoutId) clearTimeout(autoplayTimeoutId);
      autoplayFrameId = null;
      autoplayTimeoutId = null;
    }

    function stopAutoplay() {
      autoplayToken += 1;
      autoplayMode = null;
      clearAutoplayHandles();
      updatePlayButtons();
    }

    function startAutoplay(mode, applyValue, fromValue, toValue) {
      stopAutoplay();
      if (fromValue === toValue) return;

      autoplayMode = mode;
      const token = autoplayToken;
      updatePlayButtons();

      const phases = [
        { from: fromValue, to: toValue, duration: 2000 },
        { wait: 2000 },
        { from: toValue, to: fromValue, duration: 2000 },
        { wait: 2000 }
      ];

      const runPhase = (phaseIndex) => {
        if (token !== autoplayToken || autoplayMode !== mode) return;
        const phase = phases[phaseIndex % phases.length];

        if (phase.wait) {
          autoplayTimeoutId = setTimeout(() => runPhase(phaseIndex + 1), phase.wait);
          return;
        }

        const startTime = performance.now();
        const animate = (now) => {
          if (token !== autoplayToken || autoplayMode !== mode) return;
          const progress = Math.min((now - startTime) / phase.duration, 1);
          const value = phase.from + ((phase.to - phase.from) * progress);
          applyValue(value, false);

          if (progress < 1) {
            autoplayFrameId = requestAnimationFrame(animate);
            return;
          }

          runPhase(phaseIndex + 1);
        };

        autoplayFrameId = requestAnimationFrame(animate);
      };

      runPhase(0);
    }

    // ── Modos ────────────────────────────────────────────────────────────────
    function setMode(mode, tabBtn) {
      stopAutoplay();
      currentMode = mode;
      const comp = document.getElementById('comparator');
      comp.className = 'comparator mode-' + mode;

      document.querySelectorAll('.mode-tab').forEach(b => b.classList.remove('active'));
      if (tabBtn) tabBtn.classList.add('active');

      document.getElementById('hint').style.display = mode === 'split' ? 'block' : 'none';
      document.getElementById('ctrl-opacity').classList.toggle('visible', mode === 'opacity');
      document.getElementById('ctrl-timeline').classList.toggle('visible', mode === 'timeline');
      document.getElementById('main-labels').style.display = mode === 'timeline' ? 'none' : 'flex';

      const base    = document.getElementById('img-base');
      const overlay = document.getElementById('img-overlay');

      if (mode === 'split') {
        base.src    = staticURL(newPanoId, currentHead, currentPitch, currentKey);
        overlay.src = staticURL(oldPanoId, currentHead, currentPitch, currentKey);
        overlay.style.clipPath = 'inset(0 50% 0 0)';
        overlay.style.opacity  = '1';
        document.getElementById('divider').style.left = '50%';
      }

      if (mode === 'opacity') {
        // base = vieja (fija), overlay = nueva (con opacidad variable)
        base.src    = staticURL(oldPanoId, currentHead, currentPitch, currentKey);
        overlay.src = staticURL(newPanoId, currentHead, currentPitch, currentKey);
        overlay.style.clipPath = 'none';
        setOpacityValue(document.getElementById('opacity-slider').value);
      }

      if (mode === 'timeline') {
        base.src = '';
        applyTimelineIndex(currentTimelineIndex, false);
      }
    }

    // ── Split drag ───────────────────────────────────────────────────────────
    let dragging = false;

    function onCompMouseDown(e) {
      if (currentMode !== 'split') return;
      stopAutoplay();
      dragging = true;
      e.preventDefault();
      updateSplitSlider(e);
    }
    document.addEventListener('mousemove', e => { if (dragging) updateSplitSlider(e); });
    document.addEventListener('touchmove', e => { if (dragging) updateSplitSlider(e.touches[0]); });
    document.addEventListener('mouseup',  () => { dragging = false; });
    document.addEventListener('touchend', () => { dragging = false; });

    function updateSplitSlider(e) {
      const comp = document.getElementById('comparator');
      const rect = comp.getBoundingClientRect();
      const x    = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
      const pct  = (x / rect.width) * 100;
      document.getElementById('img-overlay').style.clipPath = `inset(0 ${100 - pct}% 0 0)`;
      document.getElementById('divider').style.left = pct + '%';
    }

    // ── Opacity control ──────────────────────────────────────────────────────
    function setOpacityValue(val) {
      const safeValue = Math.max(0, Math.min(100, Number(val)));
      document.getElementById('opacity-slider').value = safeValue;
      document.getElementById('img-overlay').style.opacity = safeValue / 100;
    }

    function onOpacityInput(val, fromUser = true) {
      if (fromUser) stopAutoplay();
      setOpacityValue(val);
    }

    function toggleOpacityAutoplay() {
      if (autoplayMode === 'opacity') {
        stopAutoplay();
        return;
      }

      setMode('opacity', document.getElementById('tab-opacity'));
      startAutoplay('opacity', onOpacityInput, 0, 100);
    }

    // ── Timeline control ─────────────────────────────────────────────────────

    function getNearestTimelineIndex(targetOffset) {
      let nearestIndex = 0;
      let nearestDistance = Number.POSITIVE_INFINITY;

      timelineOffsets.forEach((offset, index) => {
        const distance = Math.abs(offset - targetOffset);
        if (distance < nearestDistance) {
          nearestDistance = distance;
          nearestIndex = index;
        }
      });

      return nearestIndex;
    }

    function updateTimelineButtons() {
      document.getElementById('timeline-prev').disabled = currentTimelineIndex <= 0;
      document.getElementById('timeline-next').disabled = currentTimelineIndex >= allPanos.length - 1;
    }

    function applyTimelineIndex(index, fromUser = true) {
      if (!allPanos.length) return;
      if (fromUser) stopAutoplay();

      currentTimelineIndex = Math.max(0, Math.min(index, allPanos.length - 1));
      const p = allPanos[currentTimelineIndex];
      const offset = timelineOffsets[currentTimelineIndex] || 0;

      const overlay = document.getElementById('img-overlay');
      const src = staticURL(p.pano, currentHead, currentPitch, currentKey);
      if (overlay.src !== src) overlay.src = src;
      overlay.style.clipPath = 'none';
      overlay.style.opacity  = '1';
      document.getElementById('img-base').src = '';
      document.getElementById('timeline-slider').value = String(offset);

      document.getElementById('tl-current-label').textContent = p.label;
      updateTimelineButtons();
    }

    function onTimelineInput(val, fromUser = true) {
      if (!allPanos.length) return;
      const idx = getNearestTimelineIndex(Number(val));
      applyTimelineIndex(idx, fromUser);
    }

    function stepTimeline(direction) {
      stopAutoplay();
      applyTimelineIndex(currentTimelineIndex + direction, false);
    }

    function toggleTimelineAutoplay() {
      if (autoplayMode === 'timeline') {
        stopAutoplay();
        return;
      }

      setMode('timeline', document.getElementById('tab-timeline'));
      startAutoplay('timeline', onTimelineInput, timelineOffsets[0] || 0, timelineRangeMax);
    }

    // ── URL parser ───────────────────────────────────────────────────────────
    function parseStreetViewURL(url) {
      const coordMatch = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
      if (!coordMatch) return null;
      const lat = parseFloat(coordMatch[1]);
      const lng = parseFloat(coordMatch[2]);
      const headingMatch = url.match(/,(\d+(?:\.\d+)?)h[,\/]/);
      const heading = headingMatch ? parseFloat(headingMatch[1]) : 0;
      const tiltMatch = url.match(/,(\d+(?:\.\d+)?)t[,\/]/);
      const tilt  = tiltMatch ? parseFloat(tiltMatch[1]) : 90;
      const pitch = 90 - tilt;
      return { lat, lng, heading, pitch };
    }

    // ── API ──────────────────────────────────────────────────────────────────
    let mapsApiLoaded = false;

    function loadMapsAPI(key) {
      return new Promise((resolve, reject) => {
        if (mapsApiLoaded) { resolve(); return; }
        window.__mapsReady = () => { mapsApiLoaded = true; resolve(); };
        const s = document.createElement('script');
        s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&callback=__mapsReady`;
        s.onerror = () => reject(new Error('No se pudo cargar la API de Google Maps. Verificá tu API key.'));
        document.head.appendChild(s);
      });
    }

    function setStatus(msg, ok = false) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className   = ok ? 'ok' : '';
    }

    function staticURL(panoid, heading, pitch, key, w = 900, h = 600) {
      return `https://maps.googleapis.com/maps/api/streetview?size=${w}x${h}&pano=${encodeURIComponent(panoid)}&heading=${heading}&pitch=${pitch}&key=${encodeURIComponent(key)}`;
    }

    function preloadImage(src) {
      if (!src || cachedTimelineUrls.has(src) || pendingTimelinePreloads.has(src)) return;

      const image = new Image();
      pendingTimelinePreloads.set(src, image);

      const finalize = (loaded) => {
        pendingTimelinePreloads.delete(src);
        image.onload = null;
        image.onerror = null;
        if (loaded) cachedTimelineUrls.add(src);
      };

      image.onload = () => finalize(true);
      image.onerror = () => finalize(false);
      image.decoding = 'async';
      image.src = src;
    }

    function preloadTimelineImages() {
      if (!allPanos.length || !currentKey) return;

      const urls = new Set(
        allPanos.map((entry) => staticURL(entry.pano, currentHead, currentPitch, currentKey))
      );

      urls.forEach((src) => preloadImage(src));
    }

    function parseStreetViewDate(rawDate) {
      if (!rawDate) return null;
      if (/^\d{4}$/.test(rawDate)) return Date.UTC(Number(rawDate), 0, 1);

      if (/^\d{4}-\d{2}$/.test(rawDate)) {
        const [year, month] = rawDate.split('-').map(Number);
        return Date.UTC(year, month - 1, 1);
      }

      const parsed = Date.parse(rawDate);
      return Number.isNaN(parsed) ? null : parsed;
    }

    function formatDate(svTime) {
      const rawDate = typeof svTime === 'string' ? svTime : svTime?.description || svTime?.date || '';
      if (!rawDate) return '?';
      if (/^\d{4}$/.test(rawDate)) return rawDate;

      const timestamp = parseStreetViewDate(rawDate);
      if (timestamp === null) return rawDate;

      return new Intl.DateTimeFormat('es-AR', {
        month: 'short',
        year: 'numeric',
        timeZone: 'UTC'
      }).format(timestamp);
    }

    async function fetchPanoramaMetadata(panoId, key, fallbackDate, sourceIndex) {
      const url = `https://maps.googleapis.com/maps/api/streetview/metadata?pano=${encodeURIComponent(panoId)}&key=${encodeURIComponent(key)}`;
      const response = await fetch(url);
      if (!response.ok) return null;

      const metadata = await response.json();
      if (metadata.status !== 'OK') return null;

      const rawDate = metadata.date || fallbackDate || '';

      return {
        pano: panoId,
        rawDate,
        label: formatDate(rawDate || 'sin fecha'),
        timestamp: parseStreetViewDate(rawDate),
        sourceIndex
      };
    }

    async function buildTimelineEntries(data, key) {
      const panoEntries = [];

      (data.time || []).forEach((item, index) => {
        if (item?.pano) {
          panoEntries.push({
            pano: item.pano,
            fallbackDate: item.description || item.date || '',
            sourceIndex: index
          });
        }
      });

      if (data.location?.pano) {
        panoEntries.push({
          pano: data.location.pano,
          fallbackDate: panoEntries[panoEntries.length - 1]?.fallbackDate || '',
          sourceIndex: panoEntries.length
        });
      }

      const uniqueEntries = [];
      const seenPanos = new Set();
      panoEntries.forEach((entry) => {
        if (!seenPanos.has(entry.pano)) {
          seenPanos.add(entry.pano);
          uniqueEntries.push(entry);
        }
      });

      const entries = await Promise.all(
        uniqueEntries.map(entry => fetchPanoramaMetadata(entry.pano, key, entry.fallbackDate, entry.sourceIndex))
      );

      return entries.filter(Boolean).sort((a, b) => {
        if (Number.isFinite(a.timestamp) && Number.isFinite(b.timestamp) && a.timestamp !== b.timestamp) {
          return a.timestamp - b.timestamp;
        }

        if (Number.isFinite(a.timestamp) && !Number.isFinite(b.timestamp)) return -1;
        if (!Number.isFinite(a.timestamp) && Number.isFinite(b.timestamp)) return 1;
        return a.sourceIndex - b.sourceIndex;
      });
    }

    function rebuildTimelineScale() {
      const slider = document.getElementById('timeline-slider');
      const ticks = document.getElementById('tl-ticks');
      const rangeStart = document.getElementById('tl-range-start');
      const rangeEnd = document.getElementById('tl-range-end');

      if (!allPanos.length) {
        slider.min = '0';
        slider.max = '1';
        slider.value = '0';
        timelineOffsets = [];
        timelineRangeMax = 1;
        ticks.innerHTML = '';
        rangeStart.textContent = '—';
        rangeEnd.textContent = '—';
        return;
      }

      const firstTimestamp = allPanos.find(entry => Number.isFinite(entry.timestamp))?.timestamp ?? 0;
      timelineOffsets = allPanos.map((entry, index) => {
        if (Number.isFinite(entry.timestamp)) return entry.timestamp - firstTimestamp;
        return index === 0 ? 0 : timelineOffsets[index - 1] + 1;
      });
      timelineRangeMax = Math.max(timelineOffsets[timelineOffsets.length - 1] || 0, 1);

      slider.min = '0';
      slider.max = String(timelineRangeMax);
      slider.step = '1';
      slider.value = String(timelineOffsets[0] || 0);

      ticks.innerHTML = '';
      const total = allPanos.length;
      const labeledIndexes = new Set([0, total - 1]);
      if (total <= 8) {
        allPanos.forEach((_, index) => labeledIndexes.add(index));
      } else {
        for (let step = 1; step < 4; step += 1) {
          labeledIndexes.add(Math.round((step * (total - 1)) / 4));
        }
      }

      allPanos.forEach((entry, index) => {
        const tick = document.createElement('div');
        tick.className = 'timeline-tick';
        const left = timelineRangeMax === 0 ? 0 : (timelineOffsets[index] / timelineRangeMax) * 100;
        tick.style.left = `${left}%`;

        if (!labeledIndexes.has(index)) {
          tick.classList.add('compact');
        } else if (index === 0) {
          tick.classList.add('edge-left');
        } else if (index === total - 1) {
          tick.classList.add('edge-right');
        }

        const label = document.createElement('span');
        label.textContent = entry.label;
        tick.appendChild(label);
        ticks.appendChild(tick);
      });

      rangeStart.textContent = allPanos[0].label;
      rangeEnd.textContent = allPanos[allPanos.length - 1].label;
    }

    // ── Main ─────────────────────────────────────────────────────────────────
    async function startComparison() {
      stopAutoplay();
      const url = document.getElementById('sv-url').value.trim();
      const key = document.getElementById('api-key').value.trim();

      if (!url) { setStatus('Pegá una URL de Street View.'); return; }
      if (!key) { setStatus('Ingresá tu Google Maps API Key.'); return; }

      const parsed = parseStreetViewURL(url);
      if (!parsed) { setStatus('No se pudo leer la URL. Asegurate que sea una URL de Street View de Google Maps.'); return; }

      const btn = document.getElementById('btn-compare');
      btn.disabled = true;
      setStatus('Cargando API de Google Maps…');

      try { await loadMapsAPI(key); }
      catch(err) { setStatus(err.message); btn.disabled = false; return; }

      setStatus('Buscando panoramas históricos…');
      currentHead  = parsed.heading;
      currentPitch = parsed.pitch;
      currentKey   = key;

      const svc = new google.maps.StreetViewService();
      svc.getPanorama(
        { location: { lat: parsed.lat, lng: parsed.lng }, radius: 80,
          preference: google.maps.StreetViewPreference.NEAREST },
        async (data, status) => {
          btn.disabled = false;
          if (status !== 'OK') {
            setStatus(`No se encontró Street View (status: ${status})`);
            return;
          }

          const timelineEntries = await buildTimelineEntries(data, key);
          if (!timelineEntries.length) {
            const pano = data.location.pano;
            allPanos   = [{ pano, label: 'actual', rawDate: 'actual', timestamp: null, sourceIndex: 0 }];
            oldPanoId  = newPanoId = pano;
            setStatus('Solo hay una imagen disponible (sin historial).', true);
            showComparison('actual', 'actual', 1);
            return;
          }

          allPanos  = timelineEntries;
          oldPanoId = allPanos[0].pano;
          newPanoId = allPanos[allPanos.length - 1].pano;

          setStatus(`✓ Se encontraron ${allPanos.length} imágenes históricas.`, true);
          showComparison(allPanos[0].label, allPanos[allPanos.length - 1].label, allPanos.length);
        }
      );
    }

    function showComparison(oldDate, newDate, count) {
      // Labels
      document.getElementById('lbl-old').textContent  = oldDate;
      document.getElementById('lbl-new').textContent  = newDate;
      document.getElementById('info-old').textContent = oldDate;
      document.getElementById('info-new').textContent = newDate;
      document.getElementById('info-count').textContent = count;
      document.getElementById('op-lbl-old').textContent = oldDate;
      document.getElementById('op-lbl-new').textContent = newDate;
      document.getElementById('tl-lbl-left').textContent  = allPanos[0].label;
      document.getElementById('tl-lbl-right').textContent = allPanos[allPanos.length - 1].label;

      rebuildTimelineScale();

      // Reset sliders
      document.getElementById('opacity-slider').value  = 50;
      currentTimelineIndex = 0;

      // Imágenes iniciales (modo split)
      document.getElementById('img-base').src    = staticURL(newPanoId, currentHead, currentPitch, currentKey);
      document.getElementById('img-overlay').src = staticURL(oldPanoId, currentHead, currentPitch, currentKey);
      document.getElementById('img-overlay').style.clipPath = 'inset(0 50% 0 0)';
      document.getElementById('img-overlay').style.opacity  = '1';
      document.getElementById('divider').style.left = '50%';
      document.getElementById('tl-current-label').textContent = allPanos[0].label;
      preloadTimelineImages();
      updateTimelineButtons();
      updatePlayButtons();

      // Forzar tab split
      currentMode = 'split';
      document.getElementById('comparator').className = 'comparator mode-split';
      document.querySelectorAll('.mode-tab').forEach((b, i) => b.classList.toggle('active', i === 0));
      document.getElementById('hint').style.display = 'block';
      document.getElementById('ctrl-opacity').classList.remove('visible');
      document.getElementById('ctrl-timeline').classList.remove('visible');
      document.getElementById('main-labels').style.display = 'flex';

      document.getElementById('comparator-wrap').style.display = 'block';
      document.getElementById('comparator-wrap').scrollIntoView({ behavior: 'smooth' });
    }
  </script>
