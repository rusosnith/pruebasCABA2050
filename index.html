<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viaje en el tiempo porteño</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

  <header class="page-header">
    <h1>Viaje en el tiempo porteño</h1>
    <p class="subtitle">Elegí una ubicación para ver como cambió en la última década</p>
  </header>

  <div id="comparator-wrap">
    <div class="comparator-panel-header">
      <div class="comparator-panel-heading">
        <label for="preloaded-location" class="comparator-select-label">Elegí la ubicación</label>
        <div class="comparator-select-controls">
          <select id="preloaded-location" aria-label="Seleccionar ubicación para explorar">
            <option value="">Cargando ubicaciones...</option>
          </select>
          <button type="button" class="mini-button comparator-random-button" id="random-location-button" onclick="chooseRandomLocation()" disabled>Una al azar</button>
        </div>
      </div>
    </div>

    <p class="mode-selector-title">Elegí el tipo de comparación</p>

    <div class="mode-tabs">
      <button class="mode-tab active" id="tab-split" onclick="setMode('split', this)">Comparador</button>
      <button class="mode-tab" id="tab-opacity" onclick="setMode('opacity', this, { autoplay: true })">Opacidad</button>
      <button class="mode-tab" id="tab-timeline" onclick="setMode('timeline', this, { autoplay: true })">Linea de tiempo</button>
    </div>

    <div class="labels-row" id="main-labels">
      <div>
        <span class="label-caption">⬅ MÁS VIEJA</span>
        <span class="label-date" id="lbl-old">—</span>
      </div>
      <div>
        <span class="label-caption">MÁS NUEVA ➡</span>
        <span class="label-date" id="lbl-new">—</span>
      </div>
    </div>

    <div class="comparator mode-split" id="comparator"
         onmousedown="onCompMouseDown(event)" ontouchstart="onCompMouseDown(event)">
      <img id="img-base"    src="" alt="imagen base" />
      <img id="img-overlay" src="" alt="imagen overlay" />
      <div class="divider" id="divider">
        <div class="divider-handle">↔</div>
      </div>
    </div>

    <p id="hint">Arrastrá el divisor para comparar</p>

    <div class="controls" id="ctrl-opacity">
      <div class="slider-row opacity-slider-row">
        <div class="control-actions opacity-control-actions">
          <button class="mini-button" id="opacity-play" onclick="toggleOpacityAutoplay()">Play</button>
        </div>
        <div class="opacity-slider-stack">
          <span class="slider-label-left"  id="op-lbl-old">vieja</span>
          <input type="range" id="opacity-slider" min="0" max="100" value="50"
                 oninput="onOpacityInput(this.value)" />
          <span class="slider-label-right" id="op-lbl-new">nueva</span>
        </div>
      </div>
    </div>

    <div class="controls" id="ctrl-timeline">
      <div class="timeline-layout">
        <div class="slider-row timeline-slider-row">
          <input type="range" id="timeline-slider" min="0" max="1" step="1" value="0"
                 oninput="onTimelineInput(this.value)" />
        </div>
        <div class="timeline-ticks" id="tl-ticks"></div>
      </div>
      <div class="control-actions">
        <button class="mini-button" id="timeline-prev" onclick="stepTimeline(-1)">Prev</button>
        <button class="mini-button" id="timeline-play" onclick="toggleTimelineAutoplay()">Play</button>
        <button class="mini-button" id="timeline-next" onclick="stepTimeline(1)">Next</button>
      </div>
      <div id="tl-current-label">—</div>
    </div>

    
  </div>
<div class="timeline-info">
      <div class="badge">Más vieja<strong id="info-old">—</strong></div>
      <div class="badge">Más nueva<strong id="info-new">—</strong></div>
      <div class="badge">Imágenes históricas<strong id="info-count">—</strong></div>
    </div>

    
  <footer class="page-footer">
   

    <div class="footer-notices">
      <div class="helper-text footer-status" id="preloaded-meta" aria-live="polite">Buscando manifiesto local...</div>
      <p class="footer-status" id="status" aria-live="polite"></p>
      <div class="footer-status timeline-preload" id="tl-preload-status" aria-live="polite">
        <div class="timeline-preload-bar"><span id="tl-preload-progress"></span></div>
        <span class="timeline-preload-text" id="tl-preload-text">Preparando caché…</span>
      </div>
    </div>
  </footer>

  <script>
    const analyticsState = {
      comparatorSeen: false,
      splitTracked: false,
      opacityTracked: false,
      timelineTracked: false,
      comparisonContext: {}
    };

    function setComparisonContext(context) {
      analyticsState.comparisonContext = Object.assign({}, context || {});
    }

    function trackEvent(name, properties = {}) {
      // Event tracking disabled.
    }

    function trackError(message, properties = {}) {
      // Error reporting disabled.
    }

    function resetInteractionTracking() {
      analyticsState.comparatorSeen = false;
      analyticsState.splitTracked = false;
      analyticsState.opacityTracked = false;
      analyticsState.timelineTracked = false;
    }

    // ── Estado global ────────────────────────────────────────────────────────
    let currentMode  = 'split';
    let allPanos     = [];   // [{pano, label, rawDate, timestamp}] viejo→nuevo
    let currentHead  = 0, currentPitch = 0, currentKey = '';
    let oldPanoId = '', newPanoId = '';
    let timelineOffsets = [];
    let timelineRangeMax = 1;
    let currentTimelineIndex = 0;
    let autoplayMode = null;
    let autoplayToken = 0;
    let autoplayFrameId = null;
    let autoplayTimeoutId = null;
    let preloadedLocations = [];
    const supportedModes = new Set(['split', 'opacity', 'timeline']);
    const cachedTimelineUrls = new Set();
    const pendingTimelinePreloads = new Map();
    let preloadSessionId = 0;
    const preloadState = {
      total: 0,
      loaded: 0,
      failed: 0,
      active: false
    };

    function updatePlayButtons() {
      const opacityButton = document.getElementById('opacity-play');
      const timelineButton = document.getElementById('timeline-play');

      opacityButton.textContent = autoplayMode === 'opacity' ? 'Detener' : 'Play';
      timelineButton.textContent = autoplayMode === 'timeline' ? 'Detener' : 'Play';
      opacityButton.classList.toggle('active', autoplayMode === 'opacity');
      timelineButton.classList.toggle('active', autoplayMode === 'timeline');
    }

    function clearAutoplayHandles() {
      if (autoplayFrameId) cancelAnimationFrame(autoplayFrameId);
      if (autoplayTimeoutId) clearTimeout(autoplayTimeoutId);
      autoplayFrameId = null;
      autoplayTimeoutId = null;
    }

    function stopAutoplay() {
      autoplayToken += 1;
      autoplayMode = null;
      clearAutoplayHandles();
      updatePlayButtons();
    }

    function startAutoplay(mode, applyValue, fromValue, toValue) {
      stopAutoplay();
      if (fromValue === toValue) return;

      autoplayMode = mode;
      const token = autoplayToken;
      updatePlayButtons();

      const phases = [
        { from: fromValue, to: toValue, duration: 2000 },
        { wait: 2000 },
        { from: toValue, to: fromValue, duration: 2000 },
        { wait: 2000 }
      ];

      const runPhase = (phaseIndex) => {
        if (token !== autoplayToken || autoplayMode !== mode) return;
        const phase = phases[phaseIndex % phases.length];

        if (phase.wait) {
          autoplayTimeoutId = setTimeout(() => runPhase(phaseIndex + 1), phase.wait);
          return;
        }

        const startTime = performance.now();
        const animate = (now) => {
          if (token !== autoplayToken || autoplayMode !== mode) return;
          const progress = Math.min((now - startTime) / phase.duration, 1);
          const value = phase.from + ((phase.to - phase.from) * progress);
          applyValue(value, false);

          if (progress < 1) {
            autoplayFrameId = requestAnimationFrame(animate);
            return;
          }

          runPhase(phaseIndex + 1);
        };

        autoplayFrameId = requestAnimationFrame(animate);
      };

      runPhase(0);
    }

    // ── Modos ────────────────────────────────────────────────────────────────
    function startModeAutoplay(mode) {
      if (mode === 'opacity') {
        startAutoplay('opacity', onOpacityInput, 0, 100);
        return;
      }

      if (mode === 'timeline') {
        startAutoplay('timeline', onTimelineInput, timelineOffsets[0] || 0, timelineRangeMax);
      }
    }

    function getTabButtonForMode(mode) {
      return document.getElementById(`tab-${mode}`);
    }

    function getCurrentSelectedLocation() {
      const selectedSlug = document.getElementById('preloaded-location')?.value;
      return preloadedLocations.find((entry) => entry.slug === selectedSlug) || null;
    }

    function getLocationOrder(location) {
      if (!location) return null;
      const index = preloadedLocations.findIndex((entry) => entry.slug === location.slug);
      return index >= 0 ? index + 1 : null;
    }

    function syncUrlFragment(mode = currentMode) {
      const params = new URLSearchParams();
      const locationOrder = getLocationOrder(getCurrentSelectedLocation());

      if (locationOrder) params.set('loc', String(locationOrder));
      if (supportedModes.has(mode)) params.set('mode', mode);

      const nextHash = params.toString();
      const currentHash = window.location.hash.replace(/^#/, '');
      if (nextHash === currentHash) return;

      const nextUrl = nextHash
        ? `${window.location.pathname}${window.location.search}#${nextHash}`
        : `${window.location.pathname}${window.location.search}`;
      window.history.replaceState(null, '', nextUrl);
    }

    function parseUrlFragmentState() {
      const params = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      const rawLocationOrder = Number.parseInt(params.get('loc') || '', 10);
      const mode = params.get('mode');

      return {
        locationIndex: Number.isInteger(rawLocationOrder) && rawLocationOrder > 0
          ? rawLocationOrder - 1
          : null,
        mode: supportedModes.has(mode) ? mode : null
      };
    }

    function setMode(mode, tabBtn, options = {}) {
      const previousMode = currentMode;
      stopAutoplay();
      currentMode = mode;
      const comp = document.getElementById('comparator');
      comp.className = 'comparator mode-' + mode;

      document.querySelectorAll('.mode-tab').forEach(b => b.classList.remove('active'));
      if (tabBtn) tabBtn.classList.add('active');

      document.getElementById('hint').style.display = mode === 'split' ? 'block' : 'none';
      document.getElementById('ctrl-opacity').classList.toggle('visible', mode === 'opacity');
      document.getElementById('ctrl-timeline').classList.toggle('visible', mode === 'timeline');
      document.getElementById('main-labels').style.display = mode === 'timeline' ? 'none' : '';

      const base    = document.getElementById('img-base');
      const overlay = document.getElementById('img-overlay');

      if (mode === 'split') {
        base.src    = getImageSrc(allPanos[allPanos.length - 1]);
        overlay.src = getImageSrc(allPanos[0]);
        overlay.style.clipPath = 'inset(0 50% 0 0)';
        overlay.style.opacity  = '1';
        document.getElementById('divider').style.left = '50%';
      }

      if (mode === 'opacity') {
        // base = vieja (fija), overlay = nueva (con opacidad variable)
        base.src    = getImageSrc(allPanos[0]);
        overlay.src = getImageSrc(allPanos[allPanos.length - 1]);
        overlay.style.clipPath = 'none';
        setOpacityValue(document.getElementById('opacity-slider').value);
      }

      if (mode === 'timeline') {
        base.src = '';
        applyTimelineIndex(currentTimelineIndex, false);
      }

      if (previousMode !== mode && allPanos.length) {
        trackEvent('mode_changed', {
          from_mode: previousMode,
          to_mode: mode,
          location_label: analyticsState.comparisonContext.locationLabel,
          location_slug: analyticsState.comparisonContext.locationSlug
        });
      }

      syncUrlFragment(mode);

      if (options.autoplay && allPanos.length) {
        startModeAutoplay(mode);
      }
    }

    // ── Split drag ───────────────────────────────────────────────────────────
    let dragging = false;

    function onCompMouseDown(e) {
      if (currentMode !== 'split') return;
      stopAutoplay();
      if (!analyticsState.splitTracked) {
        analyticsState.splitTracked = true;
        trackEvent('split_drag_started', {
          location_label: analyticsState.comparisonContext.locationLabel,
          location_slug: analyticsState.comparisonContext.locationSlug
        });
      }
      dragging = true;
      e.preventDefault();
      updateSplitSlider(e);
    }
    document.addEventListener('mousemove', e => { if (dragging) updateSplitSlider(e); });
    document.addEventListener('touchmove', e => { if (dragging) updateSplitSlider(e.touches[0]); });
    document.addEventListener('mouseup',  () => { dragging = false; });
    document.addEventListener('touchend', () => { dragging = false; });

    function updateSplitSlider(e) {
      const comp = document.getElementById('comparator');
      const rect = comp.getBoundingClientRect();
      const x    = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
      const pct  = (x / rect.width) * 100;
      document.getElementById('img-overlay').style.clipPath = `inset(0 ${100 - pct}% 0 0)`;
      document.getElementById('divider').style.left = pct + '%';
    }

    // ── Opacity control ──────────────────────────────────────────────────────
    function setOpacityValue(val) {
      const safeValue = Math.max(0, Math.min(100, Number(val)));
      document.getElementById('opacity-slider').value = safeValue;
      document.getElementById('img-overlay').style.opacity = safeValue / 100;
    }

    function onOpacityInput(val, fromUser = true) {
      if (fromUser) stopAutoplay();
      if (fromUser && !analyticsState.opacityTracked) {
        analyticsState.opacityTracked = true;
        trackEvent('opacity_slider_used', {
          location_label: analyticsState.comparisonContext.locationLabel,
          location_slug: analyticsState.comparisonContext.locationSlug
        });
      }
      setOpacityValue(val);
    }

    function toggleOpacityAutoplay() {
      if (autoplayMode === 'opacity') {
        trackEvent('autoplay_toggled', { mode: 'opacity', action: 'stop' });
        stopAutoplay();
        return;
      }

      trackEvent('autoplay_toggled', { mode: 'opacity', action: 'start' });
      setMode('opacity', document.getElementById('tab-opacity'), { autoplay: true });
    }

    // ── Timeline control ─────────────────────────────────────────────────────

    function getNearestTimelineIndex(targetOffset) {
      let nearestIndex = 0;
      let nearestDistance = Number.POSITIVE_INFINITY;

      timelineOffsets.forEach((offset, index) => {
        const distance = Math.abs(offset - targetOffset);
        if (distance < nearestDistance) {
          nearestDistance = distance;
          nearestIndex = index;
        }
      });

      return nearestIndex;
    }

    function updateTimelineButtons() {
      document.getElementById('timeline-prev').disabled = currentTimelineIndex <= 0;
      document.getElementById('timeline-next').disabled = currentTimelineIndex >= allPanos.length - 1;
    }

    function applyTimelineIndex(index, fromUser = true) {
      if (!allPanos.length) return;
      if (fromUser) stopAutoplay();

      currentTimelineIndex = Math.max(0, Math.min(index, allPanos.length - 1));
      const p = allPanos[currentTimelineIndex];
      const offset = timelineOffsets[currentTimelineIndex] || 0;

      const overlay = document.getElementById('img-overlay');
      const src = getImageSrc(p);
      if (overlay.getAttribute('src') !== src) overlay.src = src;
      overlay.style.clipPath = 'none';
      overlay.style.opacity  = '1';
      document.getElementById('img-base').src = '';
      document.getElementById('timeline-slider').value = String(offset);

      document.getElementById('tl-current-label').textContent = p.label;
      updateTimelineButtons();
    }

    function onTimelineInput(val, fromUser = true) {
      if (!allPanos.length) return;
      if (fromUser && !analyticsState.timelineTracked) {
        analyticsState.timelineTracked = true;
        trackEvent('timeline_slider_used', {
          location_label: analyticsState.comparisonContext.locationLabel,
          location_slug: analyticsState.comparisonContext.locationSlug
        });
      }
      const idx = getNearestTimelineIndex(Number(val));
      applyTimelineIndex(idx, fromUser);
    }

    function stepTimeline(direction) {
      stopAutoplay();
      trackEvent('timeline_step_clicked', {
        direction: direction > 0 ? 'next' : 'prev',
        current_index: currentTimelineIndex,
        next_index: Math.max(0, Math.min(currentTimelineIndex + direction, allPanos.length - 1))
      });
      applyTimelineIndex(currentTimelineIndex + direction, false);
    }

    function toggleTimelineAutoplay() {
      if (autoplayMode === 'timeline') {
        trackEvent('autoplay_toggled', { mode: 'timeline', action: 'stop' });
        stopAutoplay();
        return;
      }

      trackEvent('autoplay_toggled', { mode: 'timeline', action: 'start' });
      setMode('timeline', document.getElementById('tab-timeline'), { autoplay: true });
    }

    function setStatus(msg, ok = false) {
      const el = document.getElementById('status');
      if (!el) return;
      el.textContent = msg;
      el.className   = ok ? 'ok' : '';
    }

    function updateTimelinePreloadStatus() {
      const status = document.getElementById('tl-preload-status');
      const progress = document.getElementById('tl-preload-progress');
      const text = document.getElementById('tl-preload-text');

      if (!preloadState.active || preloadState.total === 0) {
        status.classList.remove('visible', 'done');
        progress.style.width = '0%';
        text.textContent = 'Preparando caché…';
        return;
      }

      const completed = preloadState.loaded + preloadState.failed;
      const percent = Math.round((completed / preloadState.total) * 100);
      status.classList.add('visible');
      status.classList.toggle('done', completed >= preloadState.total && preloadState.failed === 0);
      progress.style.width = `${percent}%`;

      if (completed >= preloadState.total) {
        text.textContent = preloadState.failed
          ? `Caché lista con ${preloadState.failed} carga${preloadState.failed === 1 ? '' : 's'} pendiente${preloadState.failed === 1 ? '' : 's'}`
          : 'Timeline listo';
        return;
      }

      text.textContent = `Precargando timeline ${completed}/${preloadState.total}`;
    }

    function resetTimelinePreloadStatus() {
      preloadSessionId += 1;
      preloadState.total = 0;
      preloadState.loaded = 0;
      preloadState.failed = 0;
      preloadState.active = false;
      updateTimelinePreloadStatus();
    }

    function getImageSrc(entry) {
      if (!entry) return '';
      if (entry.image) return entry.image;
      return staticURL(entry.pano, currentHead, currentPitch, currentKey);
    }

    function setPreloadedMeta(message) {
      document.getElementById('preloaded-meta').textContent = message;
    }

    function syncPreloadedControls() {
      const hasLocations = preloadedLocations.length > 0;
      const select = document.getElementById('preloaded-location');
      const randomButton = document.getElementById('random-location-button');

      if (select) select.disabled = !hasLocations;
      if (randomButton) randomButton.disabled = !hasLocations;
    }

    function populatePreloadedSelect() {
      const select = document.getElementById('preloaded-location');
      select.innerHTML = '';

      if (!preloadedLocations.length) {
        const option = document.createElement('option');
        option.value = '';
        option.textContent = 'No hay ubicaciones precargadas todavia';
        select.appendChild(option);
        syncPreloadedControls();
        return;
      }

      preloadedLocations.forEach((location, index) => {
        const option = document.createElement('option');
        option.value = location.slug;
        option.textContent = location.label;
        if (index === 0) option.selected = true;
        select.appendChild(option);
      });

      syncPreloadedControls();
    }

    function openPreloadedLocation(location, interactionSource = 'select', options = {}) {
      if (!location) {
        setStatus('Elegi una ubicacion precargada.');
        trackError('Elegi una ubicacion precargada.', { reason: 'missing_preloaded_selection' });
        return false;
      }

      const select = document.getElementById('preloaded-location');
      if (select && select.value !== location.slug) select.value = location.slug;

      trackEvent('preloaded_location_selected', {
        interaction_source: interactionSource,
        location_label: location.label,
        location_slug: location.slug,
        pano_count: (location.panos || []).length
      });

      trackEvent('preloaded_location_opened', {
        interaction_source: interactionSource,
        location_label: location.label,
        location_slug: location.slug,
        pano_count: (location.panos || []).length
      });

      loadLocationFromManifest(location, options);
      return true;
    }

    function loadLocationFromManifest(location, options = {}) {
      stopAutoplay();
      resetTimelinePreloadStatus();
      setComparisonContext({
        source: 'preloaded',
        locationLabel: location.label,
        locationSlug: location.slug
      });

      allPanos = (location.panos || []).map((entry, index) => ({
        pano: entry.pano,
        rawDate: entry.rawDate,
        label: entry.label || formatDate(entry.rawDate || 'sin fecha'),
        timestamp: Number.isFinite(entry.timestamp) ? entry.timestamp : parseStreetViewDate(entry.rawDate),
        sourceIndex: index,
        image: entry.image
      }));

      if (!allPanos.length) {
        setStatus('La ubicacion seleccionada no tiene imagenes precargadas.');
        trackError('La ubicacion seleccionada no tiene imagenes precargadas.', {
          reason: 'preloaded_location_without_images',
          location_label: location.label,
          location_slug: location.slug
        });
        return;
      }

      currentHead = location.heading || 0;
      currentPitch = location.pitch || 0;
      currentKey = '';
      oldPanoId = allPanos[0].pano || '';
      newPanoId = allPanos[allPanos.length - 1].pano || '';
      setStatus('', true);
      showComparison(
        allPanos[0].label,
        allPanos[allPanos.length - 1].label,
        allPanos.length,
        options.mode || currentMode
      );
      trackEvent('comparison_ready', {
        source: 'preloaded',
        location_label: location.label,
        location_slug: location.slug,
        oldest_label: allPanos[0].label,
        newest_label: allPanos[allPanos.length - 1].label,
        pano_count: allPanos.length
      });
    }

    function loadSelectedLocation() {
      const selectedSlug = document.getElementById('preloaded-location').value;
      const location = preloadedLocations.find((entry) => entry.slug === selectedSlug);

      return openPreloadedLocation(location, 'select');
    }

    function chooseRandomLocation(options = {}) {
      if (!preloadedLocations.length) {
        setStatus('No hay ubicaciones precargadas para elegir al azar.');
        trackError('No hay ubicaciones precargadas para elegir al azar.', { reason: 'random_preloaded_selection_unavailable' });
        return false;
      }

      const currentSlug = document.getElementById('preloaded-location').value;
      let candidateLocations = preloadedLocations;

      if (preloadedLocations.length > 1 && currentSlug) {
        const differentLocations = preloadedLocations.filter((entry) => entry.slug !== currentSlug);
        if (differentLocations.length) candidateLocations = differentLocations;
      }

      const randomIndex = Math.floor(Math.random() * candidateLocations.length);
      return openPreloadedLocation(candidateLocations[randomIndex], 'random_button', { mode: options.mode || currentMode });
    }

    async function loadPreloadedLocations() {
      try {
        const response = await fetch(`data/manifest.json?v=${Date.now()}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const manifest = await response.json();
        preloadedLocations = Array.isArray(manifest.locations) ? manifest.locations : [];
        populatePreloadedSelect();
        trackEvent('preloaded_manifest_loaded', {
          location_count: preloadedLocations.length,
          generated_at: manifest.generatedAt || 'unknown'
        });

        if (!preloadedLocations.length) {
          setPreloadedMeta('No hay ubicaciones generadas todavia. Ejecuta el workflow de GitHub Actions para poblar este selector.');
          trackError('No hay ubicaciones generadas todavia.', { reason: 'empty_manifest' });
          return;
        }

        const generatedLabel = manifest.generatedAt
          ? new Date(manifest.generatedAt).toLocaleString('es-AR')
          : 'fecha desconocida';
        setPreloadedMeta(`${preloadedLocations.length} ubicacion(es) disponibles. Ultima generacion: ${generatedLabel}.`);

        const fragmentState = parseUrlFragmentState();
        const initialLocation = Number.isInteger(fragmentState.locationIndex)
          ? preloadedLocations[fragmentState.locationIndex] || null
          : null;
        const initialMode = fragmentState.mode || currentMode;

        if (initialLocation) {
          openPreloadedLocation(initialLocation, 'fragment', { mode: initialMode });
          return;
        }

        chooseRandomLocation({ mode: initialMode });
      } catch (error) {
        preloadedLocations = [];
        populatePreloadedSelect();
        setPreloadedMeta('No se pudo cargar data/manifest.json. Revisa que el workflow haya generado el manifiesto antes de publicar en GitHub Pages.');
        trackError('No se pudo cargar data/manifest.json.', {
          reason: 'manifest_load_failed',
          detail: error instanceof Error ? error.message : String(error)
        });
      }
    }

    function staticURL(panoid, heading, pitch, key, w = 900, h = 600) {
      return `https://maps.googleapis.com/maps/api/streetview?size=${w}x${h}&pano=${encodeURIComponent(panoid)}&heading=${heading}&pitch=${pitch}&key=${encodeURIComponent(key)}`;
    }

    function preloadImage(src) {
      if (!src) return Promise.resolve('skipped');
      if (cachedTimelineUrls.has(src)) return Promise.resolve('cached');
      if (pendingTimelinePreloads.has(src)) return pendingTimelinePreloads.get(src);

      const image = new Image();
      let resolvePreload;
      const preloadPromise = new Promise((resolve) => {
        resolvePreload = resolve;
      });
      pendingTimelinePreloads.set(src, preloadPromise);

      const finalize = (loaded) => {
        pendingTimelinePreloads.delete(src);
        image.onload = null;
        image.onerror = null;
        if (loaded) cachedTimelineUrls.add(src);
        resolvePreload(loaded ? 'loaded' : 'failed');
      };

      image.onload = () => finalize(true);
      image.onerror = () => finalize(false);
      image.decoding = 'async';
      image.src = src;
      return preloadPromise;
    }

    function buildTimelinePreloadUrls(centerIndex = 0) {
      const uniqueUrls = new Set();
      const orderedEntries = [];

      for (let distance = 0; distance < allPanos.length; distance += 1) {
        const leftIndex = centerIndex - distance;
        const rightIndex = centerIndex + distance;

        if (leftIndex >= 0) orderedEntries.push(allPanos[leftIndex]);
        if (distance !== 0 && rightIndex < allPanos.length) orderedEntries.push(allPanos[rightIndex]);
      }

      orderedEntries.forEach((entry) => {
        uniqueUrls.add(getImageSrc(entry));
      });

      return Array.from(uniqueUrls);
    }

    function scheduleBackgroundPreload(task) {
      if ('requestIdleCallback' in window) {
        window.requestIdleCallback(task, { timeout: 500 });
        return;
      }

      window.setTimeout(task, 80);
    }

    async function preloadQueue(urls, sessionId, background = false) {
      for (const src of urls) {
        if (sessionId !== preloadSessionId) return;

        const result = await preloadImage(src);
        if (sessionId !== preloadSessionId) return;

        if (result === 'loaded' || result === 'cached') {
          preloadState.loaded += 1;
        } else if (result === 'failed') {
          preloadState.failed += 1;
        }

        updateTimelinePreloadStatus();

        if (background) {
          await new Promise((resolve) => scheduleBackgroundPreload(resolve));
        }
      }
    }

    function preloadTimelineImages(centerIndex = currentTimelineIndex) {
      if (!allPanos.length) return;

      const urls = buildTimelinePreloadUrls(centerIndex);
      const readyCount = urls.filter((src) => cachedTimelineUrls.has(src)).length;
      const queuedUrls = urls.filter((src) => !cachedTimelineUrls.has(src));
      const immediateCount = Math.min(3, queuedUrls.length);
      const immediateUrls = queuedUrls.slice(0, immediateCount);
      const backgroundUrls = queuedUrls.slice(immediateCount);

      preloadSessionId += 1;
      const sessionId = preloadSessionId;
      preloadState.total = urls.length;
      preloadState.loaded = readyCount;
      preloadState.failed = 0;
      preloadState.active = urls.length > 0;
      updateTimelinePreloadStatus();

      void preloadQueue(immediateUrls, sessionId).then(() => {
        if (sessionId !== preloadSessionId || backgroundUrls.length === 0) {
          updateTimelinePreloadStatus();
          return;
        }

        scheduleBackgroundPreload(() => {
          void preloadQueue(backgroundUrls, sessionId, true);
        });
      });
    }

    function parseStreetViewDate(rawDate) {
      if (!rawDate) return null;
      if (/^\d{4}$/.test(rawDate)) return Date.UTC(Number(rawDate), 0, 1);

      if (/^\d{4}-\d{2}$/.test(rawDate)) {
        const [year, month] = rawDate.split('-').map(Number);
        return Date.UTC(year, month - 1, 1);
      }

      const parsed = Date.parse(rawDate);
      return Number.isNaN(parsed) ? null : parsed;
    }

    function formatDate(svTime) {
      const rawDate = typeof svTime === 'string' ? svTime : svTime?.description || svTime?.date || '';
      if (!rawDate) return '?';
      if (/^\d{4}$/.test(rawDate)) return rawDate;

      const timestamp = parseStreetViewDate(rawDate);
      if (timestamp === null) return rawDate;

      return new Intl.DateTimeFormat('es-AR', {
        month: 'short',
        year: 'numeric',
        timeZone: 'UTC'
      }).format(timestamp);
    }

    function rebuildTimelineScale() {
      const slider = document.getElementById('timeline-slider');
      const ticks = document.getElementById('tl-ticks');

      if (!allPanos.length) {
        slider.min = '0';
        slider.max = '1';
        slider.value = '0';
        timelineOffsets = [];
        timelineRangeMax = 1;
        ticks.innerHTML = '';
        return;
      }

      const firstTimestamp = allPanos.find(entry => Number.isFinite(entry.timestamp))?.timestamp ?? 0;
      timelineOffsets = allPanos.map((entry, index) => {
        if (Number.isFinite(entry.timestamp)) return entry.timestamp - firstTimestamp;
        return index === 0 ? 0 : timelineOffsets[index - 1] + 1;
      });
      timelineRangeMax = Math.max(timelineOffsets[timelineOffsets.length - 1] || 0, 1);

      slider.min = '0';
      slider.max = String(timelineRangeMax);
      slider.step = '1';
      slider.value = String(timelineOffsets[0] || 0);

      ticks.innerHTML = '';
      const total = allPanos.length;
      const labeledIndexes = new Set([0, total - 1]);
      if (total <= 8) {
        allPanos.forEach((_, index) => labeledIndexes.add(index));
      } else {
        for (let step = 1; step < 4; step += 1) {
          labeledIndexes.add(Math.round((step * (total - 1)) / 4));
        }
      }

      allPanos.forEach((entry, index) => {
        const tick = document.createElement('div');
        tick.className = 'timeline-tick';
        const left = timelineRangeMax === 0 ? 0 : (timelineOffsets[index] / timelineRangeMax) * 100;
        tick.style.left = `${left}%`;

        if (!labeledIndexes.has(index)) {
          tick.classList.add('compact');
        } else if (index === 0) {
          tick.classList.add('edge-left');
        } else if (index === total - 1) {
          tick.classList.add('edge-right');
        }

        const label = document.createElement('span');
        label.textContent = entry.label;
        tick.appendChild(label);
        ticks.appendChild(tick);
      });
    }

    function showComparison(oldDate, newDate, count, targetMode = currentMode) {
      resetInteractionTracking();

      // Labels
      document.getElementById('lbl-old').textContent  = oldDate;
      document.getElementById('lbl-new').textContent  = newDate;
      document.getElementById('info-old').textContent = oldDate;
      document.getElementById('info-new').textContent = newDate;
      document.getElementById('info-count').textContent = count;
      document.getElementById('op-lbl-old').textContent = oldDate;
      document.getElementById('op-lbl-new').textContent = newDate;
      rebuildTimelineScale();

      // Reset sliders
      document.getElementById('opacity-slider').value  = 50;
      currentTimelineIndex = 0;

      // Imágenes iniciales (modo split)
      document.getElementById('img-base').src    = getImageSrc(allPanos[allPanos.length - 1]);
      document.getElementById('img-overlay').src = getImageSrc(allPanos[0]);
      document.getElementById('img-overlay').style.clipPath = 'inset(0 50% 0 0)';
      document.getElementById('img-overlay').style.opacity  = '1';
      document.getElementById('divider').style.left = '50%';
      document.getElementById('tl-current-label').textContent = allPanos[0].label;
      preloadTimelineImages();
      updateTimelineButtons();
      updatePlayButtons();

      const resolvedMode = supportedModes.has(targetMode) ? targetMode : 'split';
      setMode(resolvedMode, getTabButtonForMode(resolvedMode));

      document.getElementById('comparator-wrap').classList.add('is-ready');
    }

    document.addEventListener('DOMContentLoaded', () => {
      updatePlayButtons();

      const preloadedSelect = document.getElementById('preloaded-location');
      preloadedSelect.addEventListener('change', () => {
        loadSelectedLocation();
      });

      loadPreloadedLocations();
    });
  </script>
</body>
</html>
