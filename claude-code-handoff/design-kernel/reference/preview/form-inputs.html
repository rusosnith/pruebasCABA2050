<!-- @dsCard group="Components" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="preview.css">
<style>
  .field { display: flex; flex-direction: column; gap: var(--space-2); }
  .field label { font-family: var(--font-mono); font-size: var(--text-caption); text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--muted-foreground); }
  .ctrl { background: var(--background); border: 1px solid var(--input); border-radius: var(--radius-sm); padding: 9px 12px; font-family: var(--font-sans); font-size: var(--text-small); color: var(--foreground); width: 100%; box-sizing: border-box; }
  .ctrl.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .ctrl.focus { border-color: var(--state-input-focus-border); box-shadow: 0 0 0 3px rgba(231,109,0,0.16); outline: none; }
  .ctrl.error { border-color: var(--state-input-error-border); background: var(--state-input-error-bg); }
  .err { font-family: var(--font-sans); font-size: var(--text-caption); color: var(--destructive); }
  .sel { display: flex; justify-content: space-between; align-items: center; }
  .sel svg { width: 15px; height: 15px; color: var(--muted-foreground); }
</style>
</head><body><div class="card">
<div class="eyebrow" style="margin-bottom:16px">Campos — label en mono · focus = borde naranja + halo · error en rojo frío</div>
<div class="grid" style="grid-template-columns: 1fr 1fr; gap: 18px;">
  <div class="field">
    <label>Dirección del lote</label>
    <input class="ctrl" value="Av. Corrientes 3450">
  </div>
  <div class="field">
    <label>CUIT del propietario</label>
    <input class="ctrl mono focus" value="20-12345678-3">
  </div>
  <div class="field">
    <label>Superficie (m²)</label>
    <input class="ctrl mono error" value="" placeholder="0,00">
    <span class="err">Falta la superficie del lote.</span>
  </div>
  <div class="field">
    <label>Distrito</label>
    <div class="ctrl sel"><span>R2aI</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></div>
  </div>
</div>
</div></body></html>
