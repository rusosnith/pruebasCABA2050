<!doctype html>
<!-- @dsCard group="Brand" name="Shadows / elevation" subtitle="Warm-tinted, burgundy RGB · 4 levels" viewport="700x180" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="preview.css"></head><body><div class="card">
<div class="eyebrow" style="margin-bottom:14px">Shadow / elevation — warm-tinted, burgundy RGB, never black</div>
<div class="row" style="gap:18px; align-items:stretch;">
  <div class="col" style="flex:1; align-items:center; gap:10px;">
    <div style="width:100%; height:74px; background:var(--background); border:1px solid var(--border); border-radius:var(--radius); box-shadow: 0 1px 0 0 rgba(56, 0, 0, 0.04);"></div>
    <span style="font-family:var(--font-mono); font-size:11px;">--shadow-xs</span><span style="font-size:11px; color:var(--muted-foreground);">separators</span>
  </div>
  <div class="col" style="flex:1; align-items:center; gap:10px;">
    <div style="width:100%; height:74px; background:var(--background); border:1px solid var(--border); border-radius:var(--radius); box-shadow: 0 1px 2px 0 rgba(56, 0, 0, 0.06);"></div>
    <span style="font-family:var(--font-mono); font-size:11px;">--shadow-sm</span><span style="font-size:11px; color:var(--muted-foreground);">resting cards</span>
  </div>
  <div class="col" style="flex:1; align-items:center; gap:10px;">
    <div style="width:100%; height:74px; background:var(--background); border:1px solid var(--border); border-radius:var(--radius); box-shadow: 0 4px 14px -2px rgba(56, 0, 0, 0.08);"></div>
    <span style="font-family:var(--font-mono); font-size:11px;">--shadow-md</span><span style="font-size:11px; color:var(--muted-foreground);">hover · popover</span>
  </div>
  <div class="col" style="flex:1; align-items:center; gap:10px;">
    <div style="width:100%; height:74px; background:var(--background); border:1px solid var(--border); border-radius:var(--radius); box-shadow: 0 12px 32px -8px rgba(56, 0, 0, 0.12);"></div>
    <span style="font-family:var(--font-mono); font-size:11px;">--shadow-lg</span><span style="font-size:11px; color:var(--muted-foreground);">modal · focus</span>
  </div>
</div>
<div style="margin-top:14px; font-size:12px; color:var(--muted-foreground);">Editorial pieces use no shadows — borders and color blocks only.</div>
</div></body></html>
