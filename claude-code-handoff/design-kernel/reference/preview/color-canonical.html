<!doctype html>
<!-- @dsCard group="Brand" name="Canonical colors" subtitle="The 3 hexes — primary, background, foreground" viewport="700x220" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="preview.css"></head><body><div class="card">
<div class="eyebrow" style="margin-bottom:14px; color:#5C3A2E;">The 3 canonical Terres hexes — everything else derives</div>
<div class="grid" style="grid-template-columns: repeat(3, 1fr);">

  <!-- Orange bg: cream text + cream accent -->
  <div class="swatch" style="background:#E76D00; color:#FFEDD6; border-color:#E76D00;">
    <div>
      <div class="name" style="color:#FFEDD6;">Primary</div>
      <div style="font-family:var(--font-sans); font-size:11px; color:#FFEDD6; opacity:0.85; margin-top:2px;">--primary</div>
    </div>
    <div class="hex" style="color:#FFEDD6;">#E76D00</div>
  </div>

  <!-- Cream bg: brown text + orange complement -->
  <div class="swatch" style="background:#FFEDD6; color:#380000; border-color:#E8D2B0;">
    <div>
      <div class="name" style="color:#380000;">Background <span style="color:#E76D00;">·</span></div>
      <div style="font-family:var(--font-sans); font-size:11px; color:#380000; opacity:0.7; margin-top:2px;">--background</div>
    </div>
    <div class="hex" style="color:#E76D00;">#FFEDD6</div>
  </div>

  <!-- Burgundy bg: cream text + orange complement -->
  <div class="swatch" style="background:#380000; color:#FFEDD6; border-color:#380000;">
    <div>
      <div class="name" style="color:#FFEDD6;">Foreground <span style="color:#E76D00;">·</span></div>
      <div style="font-family:var(--font-sans); font-size:11px; color:#FFEDD6; opacity:0.85; margin-top:2px;">--foreground</div>
    </div>
    <div class="hex" style="color:#E76D00;">#380000</div>
  </div>

</div>
<div style="margin-top:14px; font-size:12px; color:#5C3A2E; line-height:1.5;">
  Institutional pair: <span style="color:#FFEDD6; background:#E76D00; padding:1px 6px; border-radius:3px;">cream on orange</span> (2.78:1). Terres signature — do not override.
</div>
</div></body></html>
